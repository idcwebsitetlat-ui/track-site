<div class="page narrow">
<section class="card enter" aria-labelledby="login-h" style="max-width:30rem;margin:2rem auto 0">
<p class="eyebrow">אתר המסלול · תשפ״ז</p>
<h1 class="h1" id="login-h">כניסה</h1>
<p class="lead" style="margin-bottom:1.25rem">האתר פתוח לסטודנטים במסלול כלכלה, מנהל עסקים וחשבונאות. כותבים שם פרטי ושם משפחה, כמו שהם רשומים באוניברסיטה.</p>
<form id="login-form" novalidate>
<div class="field">
<label for="first">שם פרטי</label>
<input class="input" id="first" name="first" autocomplete="given-name" required>
</div>
<div class="field">
<label for="last">שם משפחה</label>
<input class="input" id="last" name="last" autocomplete="family-name" required>
</div>
<p class="err" id="login-err" role="alert" hidden></p>
<button type="submit" class="btn" id="login-btn" style="width:100%;margin-top:.5rem">כניסה</button>
</form>
<p class="hint" style="margin-top:1.25rem">אין סיסמה ואין תעודת זהות. השם נבדק מול רשימת הסטודנטים במסלול, והכניסה נשמרת בדפדפן הזה ל-30 יום. <a href="privacy.html">הצהרת פרטיות</a></p>
</section>
</div>
